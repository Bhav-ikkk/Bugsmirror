name: security_alerts_dashboard
description: A Flutter Web console for reviewing mobile security alerts.
publish_to: none
version: 1.0.0+1

environment:
  sdk: ^3.14.0

dependencies:
  flutter:
    sdk: flutter
  material_ui: ^1.11.1
  provider: ^6.1.5
  go_router: ^18.1.4
  intl: ^0.20.3
  csv: ^6.0.0
  web: ^1.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/alerts.json
